trigger:
  - main

parameters:
  - name: VERSION_OR_BRANCH
    displayName: 'Version tag or branch name'
    type: string
    default: 'main'

pool:
  name: Linux-agent-pool

jobs:
- job: Deploy
  displayName: 'Deploy Services'
  steps:
  - checkout: self
    fetchDepth: 0
    displayName: 'Initial Checkout'
  
  - script: |
      echo "Attempting to checkout: ${{ parameters.VERSION_OR_BRANCH }}"
      
      if git show-ref --verify --quiet refs/heads/${{ parameters.VERSION_OR_BRANCH }}; then
        git checkout ${{ parameters.VERSION_OR_BRANCH }}
      elif git show-ref --verify --quiet refs/tags/${{ parameters.VERSION_OR_BRANCH }}; then
        git checkout tags/${{ parameters.VERSION_OR_BRANCH }}
      else
        echo "Error: '${{ parameters.VERSION_OR_BRANCH }}' not found"
        exit 1
      fi
      
      echo "Successfully checked out: ${{ parameters.VERSION_OR_BRANCH }}"
      git log -1 --oneline
    displayName: 'Checkout ${{ parameters.VERSION_OR_BRANCH }}'
  
  - script: |
      docker --version
      echo "Ready for deployment"
    displayName: 'Deploy'