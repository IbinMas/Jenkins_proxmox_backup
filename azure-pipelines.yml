stages:
- stage: ManualValidationWithExternalEmail
  displayName: 'Manual Validation with External Email'
  jobs:
  - job: WaitForApprovalAndNotify
    displayName: 'Approval Job'
    pool: server # Agentless job
    steps:
    - task: ManualValidation@0
      displayName: 'Request Internal Approval'
      inputs:
        notifyUsers: 'internal-user@your-org.com' # Required for manual validation
        instructions: 'An external email was also sent for this approval. Please review and act accordingly.'
    - task: SendEmail@1
      inputs:
        To: 'sadat.mohammed@regent.edu.gh'
        CC: 'sadat.mohammed@esoko.com'
        From: 'azuredevops@microsoft.com'
        Subject: 'Perform Manual Validation'
        Body: |
          # Add more email addresses or group names, each on a new line
                  instructions: 'Please review the deployment configuration and approve to proceed.'
                  onTimeout: 'reject' # Optional: Action to take if the timeout is reached (reject or resume)
        BodyAsHtml: true
        AddAttachment: false




