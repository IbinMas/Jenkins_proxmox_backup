trigger:
  - main

parameters:
  - name: VERSION_OR_BRANCH
    displayName: 'Version tag or branch name'
    type: string
    default: 'main'

stages:
- stage: Build
  displayName: "Build Stage"

  jobs:
  - job: ManualValidationJob
    displayName: 'Perform Manual Validation'
    pool: server # Manual validation tasks typically run on a server pool
    steps:
    - task: ManualValidation@0 # Or ManualValidation@1
      timeoutInMinutes: 120 # Optional: Timeout for the manual validation step
      inputs:
        notifyUsers: |
          sadat.mohammed@regent.edu.gh
          sadatbunmohammed@outlook.com
          mohammedanuwarsadat@gmail.com
          sadat.mohammed@esoko.com
          # Add more email addresses or group names, each on a new line
        instructions: 'Please review the deployment configuration and approve to proceed.'
        onTimeout: 'reject' # Optional: Action to take if the timeout is reached (reject or resume)
      displayName: 'Manual Validation Step'
      
