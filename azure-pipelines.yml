trigger:
  - main

parameters:
  - name: VERSION_OR_BRANCH
    displayName: 'Version tag or branch name'
    type: string
    default: '$(Build.SourceBranchName)'

  - name: ENVIRONMENT
    displayName: 'Target environment'
    type: string
    default: 'sandbox'
    values:
      - sandbox
      - dev
      - stage
      - prod
      - common
      - critical-env



variables:
  DEPLOY_PATH: 'nexus-v3.69.0'
  TARGET_SERVER: 'DevOps-01'
  # NEXUS_ADMIN_PASSWORD: # Add as pipeline variable or use Azure Key Vault

stages:
- stage: Approval
  displayName: 'Manual Approval Stage'
  jobs:
  - job: A_ManualApprovalTest
    displayName: 'Manual Approval'
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: |
          sadatbunmohammed@outlook.com
        instructions: 'Please validate the deployment for ${{ parameters.ENVIRONMENT }} environment with version/branch: ${{ parameters.VERSION_OR_BRANCH }}'

- stage: Deploy
  displayName: 'Deployment Stage'
  dependsOn: Approval
  jobs:
  - job: B
    displayName: 'Deploy Services'
    pool:
      name: Linux-agent-pool
    steps:
    - checkout: self
      fetchDepth: 0  # Get full history including all tags
      displayName: 'Initial Checkout'
    
    - script: |
        docker --version
        docker ps
        echo "Running on agent: $AGENT_NAME"
        echo "##vso[task.setvariable variable=MyVar;isOutput=true]$AGENT_NAME"
      name: ProduceVar
      displayName: 'Agent Info'
      
    - script: |
        cd $(Build.SourcesDirectory)
        
        # Fetch all branches and tags
        echo "Fetching all references..."
        git fetch --all --tags
        
        # Check if the specified reference exists and checkout
        echo "Attempting to checkout: ${{ parameters.VERSION_OR_BRANCH }}"
        
        # Check for local branch first
        if git show-ref --verify --quiet refs/heads/${{ parameters.VERSION_OR_BRANCH }}; then
          echo "Checking out local branch: ${{ parameters.VERSION_OR_BRANCH }}"
          git checkout ${{ parameters.VERSION_OR_BRANCH }}
        # Check for remote branch
        elif git show-ref --verify --quiet refs/remotes/origin/${{ parameters.VERSION_OR_BRANCH }}; then
          echo "Checking out remote branch: origin/${{ parameters.VERSION_OR_BRANCH }}"
          git checkout -b ${{ parameters.VERSION_OR_BRANCH }} origin/${{ parameters.VERSION_OR_BRANCH }}
        # Check for tag
        elif git show-ref --verify --quiet refs/tags/${{ parameters.VERSION_OR_BRANCH }}; then
          echo "Checking out tag: ${{ parameters.VERSION_OR_BRANCH }}"
          git checkout tags/${{ parameters.VERSION_OR_BRANCH }}
        # Check for commit hash
        elif git cat-file -e ${{ parameters.VERSION_OR_BRANCH }} 2>/dev/null; then
          echo "Checking out commit: ${{ parameters.VERSION_OR_BRANCH }}"
          git checkout ${{ parameters.VERSION_OR_BRANCH }}
        else
          echo "Error: '${{ parameters.VERSION_OR_BRANCH }}' is not a valid branch, tag, or commit hash"
          echo ""
          echo "Available local branches:"
          git branch
          echo ""
          echo "Available remote branches:"
          git branch -r
          echo ""
          echo "Available tags:"
          git tag --list
          exit 1
        fi
        
        echo "Successfully checked out: ${{ parameters.VERSION_OR_BRANCH }}"
        echo "Current commit:"
        git log -1 --oneline
      displayName: 'Checkout ${{ parameters.VERSION_OR_BRANCH }}'
    
    # - script: |
    #     echo "Environment: ${{ parameters.ENVIRONMENT }}"
    #     echo "Services: ${{ parameters.SERVICES }}"
    #     echo "Roles: ${{ parameters.ROLES }}"
    #     echo "Deploy Path: $(DEPLOY_PATH)"
    #     echo "Target Server: $(TARGET_SERVER)"
    #     echo "Version/Branch: ${{ parameters.VERSION_OR_BRANCH }}"
    #   displayName: 'Display Parameters and Variables'
    
    # Add your build steps here
    # Example:
    # - script: |
    #     docker build -t myapp:${{ parameters.VERSION_OR_BRANCH }} .
    #   displayName: 'Build Docker Image'
    
    # Add your deployment steps here
    # Example:
    # - script: |
    #     # Your deployment commands using the checked out version
    #   displayName: 'Deploy to ${{ parameters.ENVIRONMENT }}'
    



