
trigger:
  - main

stages:
- stage: One
  jobs:
  - job: A_ManualApprovalTest
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: |
          mohammedanuwaarsadat@gmail.com
        instructions: 'Please validate this'

  - job: A
    dependsOn: A_ManualApprovalTest
    pool:
      name: Linux-agent-pool
    steps:
    - script: |
        docker --version
        docker ps
        echo "Running on agent: $AGENT_NAME"
        echo "##vso[task.setvariable variable=MyVar;isOutput=true]$AGENT_NAME"
      name: ProduceVar

- stage: Two
  dependsOn:
    - One
  jobs:
  - job: B_waitForValidation
    pool: server  # Server job required for ManualValidation
    variables:
      varFromA: $[ dependencies.One.A.outputs['ProduceVar.MyVar'] ]
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          sadatbunmohammed@outlook.com
        instructions: 'Please validate the build configuration and resume'
        onTimeout: 'resume'

  - job: B_followUp
    dependsOn: B_waitForValidation
    pool:
      name: Linux-agent-pool
    variables:
      varFromA: $[ dependencies.One.A.outputs['ProduceVar.MyVar'] ]
    steps:
    - script: echo $(varFromA)

- stage: Three
  dependsOn:
    - One
    - Two
  jobs:
  - job: C_waitForValidation
    pool: server
    variables:
      varFromA: $[ dependencies.One.A.outputs['ProduceVar.MyVar'] ]
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          sadatbunmohammed@outlook.com
        instructions: 'Please validate the build configuration and resume'
        onTimeout: 'resume'

  - job: C
    dependsOn: C_waitForValidation  # <-- This ensures C runs after validation
    pool:
      name: Linux-agent-pool
    variables:
      varFromA: $[ dependencies.One.A.outputs['ProduceVar.MyVar'] ]
    steps:
    - script: echo $(varFromA)


