trigger:
  - main

variables:
  AgentName: ''  # Variable to store agent name dynamically

pool:
  name: Default  # Using the Default agent pool

stages:
- stage: Build_stage
  jobs:
  - job: BuildJob
    displayName: "Build Stage"
    pool:
      name: Default  # Ensures the same pool
    steps:
      - script: |
          echo "Running on agent: $AGENT_NAME"
          echo "##vso[task.setvariable variable=AgentName;isOutput=true]$AGENT_NAME"
        name: CaptureAgent  # This is an important step name for referencing later

- stage: Deploying_Service_to_AKS
  dependsOn: Build_stage  # Ensures sequential execution
  variables:
    AgentName: $[ dependencies.Build_stage.outputs['BuildJob.CaptureAgent.AgentName'] ]  # Retrieves the agent name
  jobs:
  - job: DeployJob
    displayName: "Deploying Service to AKS"
    pool:
      name: Default
      #demands:
      #  - Agent.Name -equals $(AgentName)  # Forces selection of the same agent
    steps:
      - script: |
          echo "Deploying service to AKS using agent: $(AgentName)"